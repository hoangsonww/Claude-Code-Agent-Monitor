apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agent-monitor
  namespace: agent-monitor
  labels:
    app.kubernetes.io/name: agent-monitor
    app.kubernetes.io/instance: agent-monitor
    app.kubernetes.io/version: "2.0.8"
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: kustomize
    # Common label for Prometheus Operator discovery
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-monitor
      app.kubernetes.io/instance: agent-monitor
  namespaceSelector:
    matchNames:
      - agent-monitor
  endpoints:
    - port: http
      path: /api/metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
      authorization:
        type: Bearer
        credentials:
          name: agent-monitor-secrets
          key: dashboard-token
