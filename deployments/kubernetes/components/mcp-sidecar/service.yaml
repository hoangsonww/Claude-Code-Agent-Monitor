apiVersion: v1
kind: Service
metadata:
  name: agent-monitor-mcp
  namespace: agent-monitor
  labels:
    app.kubernetes.io/name: agent-monitor
    app.kubernetes.io/instance: agent-monitor
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent-monitor
    app.kubernetes.io/instance: agent-monitor
  ports:
    - name: mcp
      port: 8819
      targetPort: mcp
      protocol: TCP
