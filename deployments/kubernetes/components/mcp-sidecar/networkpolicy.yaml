apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-monitor-mcp
  namespace: agent-monitor
  labels:
    app.kubernetes.io/name: agent-monitor
    app.kubernetes.io/instance: agent-monitor
    app.kubernetes.io/component: mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-monitor
      app.kubernetes.io/instance: agent-monitor
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              ccam.dev/mcp-client: "true"
      ports:
        - protocol: TCP
          port: 8819
