apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-monitor
  namespace: agent-monitor
spec:
  template:
    spec:
      containers:
        - name: mcp-sidecar
          image: ccam-mcp:2.1.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: mcp
              containerPort: 8819
              protocol: TCP

          env:
            - name: MCP_TRANSPORT
              value: "http"
            - name: MCP_DASHBOARD_BASE_URL
              value: "http://127.0.0.1:4820"
            - name: MCP_HTTP_HOST
              value: "0.0.0.0"
            - name: MCP_HTTP_PORT
              value: "8819"
            - name: MCP_HTTP_AUTH_TOKEN_FILE
              value: "/run/ccam-secrets/mcp-token"
            - name: MCP_DASHBOARD_API_TOKEN_FILE
              value: "/run/ccam-secrets/dashboard-token"
            - name: MCP_DASHBOARD_ALLOW_MUTATIONS
              value: "false"
            - name: MCP_DASHBOARD_ALLOW_DESTRUCTIVE
              value: "false"

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"

          startupProbe:
            httpGet:
              path: /health
              port: mcp
              httpHeaders:
                - name: Host
                  value: localhost
            failureThreshold: 30
            periodSeconds: 2

          readinessProbe:
            httpGet:
              path: /health
              port: mcp
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: mcp
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /run/ccam-secrets
              readOnly: true
