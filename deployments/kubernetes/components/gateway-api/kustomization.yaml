apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

metadata:
  name: gateway-api

resources:
  - httproute.yaml

patches:
  - target:
      kind: Ingress
      name: agent-monitor
    patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: agent-monitor
