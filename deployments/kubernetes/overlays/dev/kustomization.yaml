apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: agent-monitor-dev

namespace: agent-monitor-dev

resources:
  - ../../base

images:
  - name: ccam-dashboard
    newTag: 2.1.1

patches:
  - path: patches/deployment-patch.yaml
  - target:
      kind: Namespace
      name: agent-monitor
    patch: |
      - op: replace
        path: /metadata/name
        value: agent-monitor-dev
  - target:
      kind: ConfigMap
      name: agent-monitor-config
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: agent-monitor-config
      data:
        NODE_ENV: production
