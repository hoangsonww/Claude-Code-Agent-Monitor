upstream ccam_dashboard {
  zone ccam_dashboard 64k;
  server agent-monitor:4820 resolve;
  keepalive 32;
}

server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  limit_conn ccam_connections 100;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok","service":"ccam-nginx"}';
  }

  # Hook ingestion is intentionally private. Host-side Claude Code and Codex
  # hooks post to the dashboard's loopback-only port by default. To accept
  # authenticated remote hooks, mount snippets/hooks-proxy.conf instead.
  location ^~ /api/hooks {
    include /etc/nginx/snippets/hooks-policy.conf;
  }

  # Prometheus reaches this endpoint on the private Compose/Kubernetes network.
  location = /api/metrics {
    return 404;
  }

  location = /mcp {
    include /etc/nginx/snippets/mcp-policy.conf;
  }

  location = /sse {
    include /etc/nginx/snippets/mcp-policy.conf;
  }

  location = /messages {
    include /etc/nginx/snippets/mcp-policy.conf;
  }

  location /ws {
    proxy_pass http://ccam_dashboard;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
  }

  location /api/ {
    limit_req zone=ccam_api burst=60 nodelay;
    proxy_pass http://ccam_dashboard;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 10s;
    proxy_read_timeout 10m;
    proxy_send_timeout 10m;
    proxy_request_buffering off;
  }

  location / {
    proxy_pass http://ccam_dashboard;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
  }
}
