apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-monitor.fullname" . }}-config
  labels:
    {{- include "agent-monitor.labels" . | nindent 4 }}
data:
  DASHBOARD_BASE_URL: {{ include "agent-monitor.baseUrl" . | quote }}
  {{- $config := omit .Values.config "baseUrl" "DASHBOARD_BASE_URL" }}
  {{- range $key, $value := $config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- range $key, $value := .Values.extraEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
