{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  labels:
    {{- include "agent-monitor.labels" . | nindent 4 }}
type: Opaque
stringData:
  dashboard-token: {{ .Values.secrets.dashboardToken | quote }}
  hook-token: {{ .Values.secrets.hookToken | quote }}
  mcp-token: {{ .Values.secrets.mcpToken | quote }}
{{- end }}
