{{- if .Values.gatewayAPI.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "agent-monitor.fullname" . }}
  labels:
    {{- include "agent-monitor.labels" . | nindent 4 }}
  {{- with .Values.gatewayAPI.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.gatewayAPI.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.gatewayAPI.hostnames | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ include "agent-monitor.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
