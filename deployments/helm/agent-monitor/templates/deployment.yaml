apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-monitor.fullname" . }}
  labels:
    {{- include "agent-monitor.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "agent-monitor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "agent-monitor.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "agent-monitor.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # ── Main application container ────────────────────────────────────
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "agent-monitor.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "agent-monitor.fullname" . }}-config
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: DASHBOARD_TOKEN_FILE
              value: /run/ccam-secrets/dashboard-token
            - name: DASHBOARD_HOOK_TOKEN_FILE
              value: /run/ccam-secrets/hook-token
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          lifecycle:
            preStop:
              exec:
                # Allow in-flight requests (including WebSockets) to drain before SIGTERM
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: secrets
              mountPath: /run/ccam-secrets
              readOnly: true
            {{- if .Values.ssh.existingSecret }}
            - name: ssh
              mountPath: {{ .Values.ssh.mountPath }}
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
          {{- if .Values.mcp.enabled }}
        # ── MCP sidecar container ─────────────────────────────────────────
        - name: mcp
          {{- with .Values.mcp.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "agent-monitor.mcpImage" . }}
          imagePullPolicy: {{ .Values.mcp.image.pullPolicy }}
          ports:
            - name: mcp
              containerPort: {{ .Values.mcp.port }}
              protocol: TCP
          env:
            - name: MCP_TRANSPORT
              value: http
            - name: MCP_HTTP_HOST
              value: 0.0.0.0
            - name: MCP_HTTP_PORT
              value: {{ .Values.mcp.port | quote }}
            - name: MCP_HTTP_AUTH_TOKEN_FILE
              value: /run/ccam-secrets/mcp-token
            - name: MCP_DASHBOARD_BASE_URL
              value: http://127.0.0.1:4820
            - name: MCP_DASHBOARD_API_TOKEN_FILE
              value: /run/ccam-secrets/dashboard-token
            - name: MCP_DASHBOARD_ALLOW_MUTATIONS
              value: {{ .Values.mcp.allowMutations | quote }}
            - name: MCP_DASHBOARD_ALLOW_DESTRUCTIVE
              value: {{ .Values.mcp.allowDestructive | quote }}
            - name: MCP_LOG_LEVEL
              value: {{ .Values.mcp.logLevel | quote }}
          startupProbe:
            httpGet:
              path: /health
              port: mcp
              httpHeaders:
                - name: Host
                  value: localhost
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: mcp
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: mcp
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- with .Values.mcp.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /run/ccam-secrets
              readOnly: true
          {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "agent-monitor.fullname" .)) }}
        - name: secrets
          secret:
            secretName: {{ .Values.secrets.existingSecret }}
            defaultMode: 0400
        {{- if .Values.ssh.existingSecret }}
        - name: ssh
          secret:
            secretName: {{ .Values.ssh.existingSecret }}
            defaultMode: 0400
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
      terminationGracePeriodSeconds: 30
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
