# Verifies that every applicable source file touched in a pull request includes
# the mandatory @author Son Nguyen copyright/authorship header. Supports JS/TS,
# Python, shell, and CSS comment styles — see .claude/skills/file-headers/.
#
# @author Son Nguyen <hoangson091104@gmail.com>
name: 📋 File Headers

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Base commit for a token-created pull request"
        type: string
        required: true
      head_sha:
        description: "Head commit for a token-created pull request"
        type: string
        required: true

permissions:
  contents: read

jobs:
  file-headers:
    name: "📋 Copyright / authorship headers"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check headers on PR diff
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_SHA" != "$HEAD_SHA" ]; then
            echo "::error::The release branch advanced after the requested head SHA was captured"
            exit 1
          fi
          set +e
          bash .claude/skills/file-headers/scripts/check-headers-pr.sh \
            "$BASE_SHA" \
            "$HEAD_SHA" | tee /tmp/header-check.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit "${code}"

      - name: Write job summary
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
        run: |
          {
            echo "## 📋 File header check"
            echo
            echo "**Base:** \`$BASE_SHA\`"
            echo "**Head:** \`$HEAD_SHA\`"
            echo
            echo '```'
            cat /tmp/header-check.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
